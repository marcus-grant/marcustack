# marcustack rclone example.
# Copy to ~/.config/marcustack/galleries/COLLECTION/rclone.conf,
# chmod 600, and fill in your values.
# Never commit the filled-in copy; it holds storage zone passwords.
# The path to the copy goes in config.toml under [deploy] rclone_conf.

# Storage zone holding pics/COLLECTION/original and display.
[pics]
type = ftp
host = storage.bunnycdn.com
port = 21
user = your-pics-zone-name
# Output of `rclone obscure`, never the plain password.
pass = your-obscured-password

# Storage zone holding everything else in the site tree.
[site]
type = ftp
host = storage.bunnycdn.com
port = 21
user = your-site-zone-name
pass = your-obscured-password