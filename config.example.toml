# marcustack configuration example.
# Copy to ~/.config/marcustack/config.toml and fill in your values.
# Override the location with MARCUSTACK_CONFIG.
# It holds paths and counts only, never credentials.

[source]
# Local directory containing the full-resolution photos.
full_dir = "/path/to/photos/full"
# Local directory containing the web-compressed photos.
web_dir = "/path/to/photos/web"
# Number of photos expected in each collection.
expected_count = 0

[output]
# Site root. normpic writes its manifests and symlink trees under
# pics/COLLECTION/original and pics/COLLECTION/display here, and
# galleria writes gallery/ and its derived renditions beside them.
# Relative paths resolve against the repository root.
site_dir = "_build"
# Collection name passed to normpic, used in generated filenames.
# One name for both collections, so entries pair on relative_path.
collection_name = "wedding"

[normpic]
# Git tag installed by `just install-normpic`.
# Pinned so parallel development upstream cannot change what runs.
version = "v0.1.1"

[galleria]
# Git tag run via `uv tool run`, pinned for the same reason.
version = "v0.0.3"

[deploy]
# Credentials are found by convention at
# ~/.config/marcustack/galleries/COLLECTION_NAME/pics.hdr and
# site.hdr, one AccessKey header line each.
# marcustack passes those paths to curl and never reads them.
# Bunny storage endpoint for both zones, from the API/HTTP pane.
storage_host = "storage.bunnycdn.com"
# Storage zone names for this gallery.
pics_zone = "your-pics-zone"
site_zone = "your-site-zone"
